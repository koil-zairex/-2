<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Список покупок | Чек-лист</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root {
      --bg-body-start: #e9eef3;
      --bg-body-end: #dce3ec;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.05);
      --header-bg: #2c3e4e;
      --header-text: #fff;
      --header-sub-opacity: 0.8;
      --form-bg: #ffffff;
      --border-light: #eef2f5;
      --label-color: #5b6e7c;
      --input-bg: #fefefe;
      --input-border: #e2e8f0;
      --input-focus: #2c7da0;
      --input-focus-shadow: rgba(44, 125, 160, 0.2);
      --btn-primary: #2c7da0;
      --btn-primary-hover: #1f5e7a;
      --stats-color: #4a6272;
      --stats-border: #e2edf2;
      --item-bg: #fbfdff;
      --item-border: #eef3f8;
      --item-hover-bg: #fafeff;
      --item-hover-border: #cbdde6;
      --text-primary: #1e2f3a;
      --text-muted: #8da1ae;
      --badge-bg: #eef2f7;
      --badge-color: #2c5a6e;
      --price-color: #1a6b4a;
      --empty-bg: #fafdff;
      --empty-border: #cfdfe8;
      --empty-color: #8fabb9;
      --panel-bg: #f8fafc;
      --panel-border: #e2e8f0;
      --danger: #d9534f;
      --overlay: rgba(0, 0, 0, 0.45);
    }

    [data-theme="dark"] {
      --bg-body-start: #1a2229;
      --bg-body-end: #0f1419;
      --card-bg: rgba(30, 38, 48, 0.98);
      --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
      --header-bg: #1e2a36;
      --header-text: #e8eef3;
      --form-bg: #252f3b;
      --border-light: #3a4654;
      --label-color: #9eb0be;
      --input-bg: #1e2832;
      --input-border: #4a5a6a;
      --input-focus: #4db8e8;
      --input-focus-shadow: rgba(77, 184, 232, 0.25);
      --btn-primary: #3d9ec4;
      --btn-primary-hover: #2d7fa3;
      --stats-color: #a8bcc9;
      --stats-border: #3a4654;
      --item-bg: #2a3542;
      --item-border: #3d4d5c;
      --item-hover-bg: #323f4e;
      --item-hover-border: #5a7085;
      --text-primary: #e8eef3;
      --text-muted: #7a8f9e;
      --badge-bg: #3a4654;
      --badge-color: #a8d4e8;
      --price-color: #6dd4a8;
      --empty-bg: #252f3b;
      --empty-border: #4a5a6a;
      --empty-color: #8fa8b8;
      --panel-bg: #1e2832;
      --panel-border: #3a4654;
      --overlay: rgba(0, 0, 0, 0.65);
    }

    body {
      background: linear-gradient(145deg, var(--bg-body-start) 0%, var(--bg-body-end) 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem;
      transition: background 0.3s ease;
    }

    .shopping-card {
      max-width: 720px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 2rem;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      transition: background 0.3s ease, box-shadow 0.3s ease;
      margin: auto 0;
    }

    .header {
      background: var(--header-bg);
      padding: 1.25rem 1.5rem;
      color: var(--header-text);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .header-main h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-main h1::before {
      content: "🛒";
      font-size: 1.6rem;
    }

    .sub {
      margin-top: 0.35rem;
      opacity: var(--header-sub-opacity);
      font-size: 0.82rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: inherit;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.05);
    }

    /* выбор списков */
    .lists-bar {
      padding: 1rem 1.5rem;
      background: var(--form-bg);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .lists-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      flex: 1;
      min-width: 0;
    }

    .list-tab {
      background: var(--badge-bg);
      border: 1.5px solid var(--item-border);
      color: var(--text-primary);
      padding: 0.45rem 0.85rem;
      border-radius: 2rem;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list-tab.active {
      background: var(--btn-primary);
      border-color: var(--btn-primary);
      color: #fff;
    }

    .list-tab:hover:not(.active) {
      border-color: var(--input-focus);
    }

    .btn-small {
      background: var(--btn-primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn-small:hover {
      background: var(--btn-primary-hover);
    }

    .btn-small.outline {
      background: transparent;
      border: 1.5px solid var(--input-border);
      color: var(--text-primary);
    }

    .btn-small.outline:hover {
      border-color: var(--input-focus);
    }

    .btn-small.danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }

    .list-name-edit {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    .list-name-edit input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1.5px solid var(--input-border);
      border-radius: 0.75rem;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
    }

    .list-name-edit input:focus {
      border-color: var(--input-focus);
    }

    .add-form {
      padding: 1.25rem 1.5rem 1rem;
      background: var(--form-bg);
      border-bottom: 1px solid var(--border-light);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .input-group {
      flex: 1;
      min-width: 120px;
    }

    .input-group.narrow {
      flex: 0 0 100px;
      min-width: 90px;
    }

    .input-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--label-color);
      margin-bottom: 0.25rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      border: 1.5px solid var(--input-border);
      border-radius: 1rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: 0.2s;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--input-focus-shadow);
    }

    .btn-add {
      background: var(--btn-primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.7rem 1.4rem;
      border-radius: 2rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .btn-add:hover {
      background: var(--btn-primary-hover);
      transform: scale(0.98);
    }

    .list-container {
      padding: 0.5rem 1.2rem 1.5rem;
      background: var(--form-bg);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--stats-color);
      margin: 0.5rem 0.6rem 0.8rem;
      border-bottom: 1px dashed var(--stats-border);
      padding-bottom: 0.6rem;
    }

    .shopping-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .list-item {
      background: var(--item-bg);
      border-radius: 1.2rem;
      border: 1px solid var(--item-border);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem 0.65rem 1rem;
      gap: 0.5rem;
    }

    .list-item:hover {
      background: var(--item-hover-bg);
      border-color: var(--item-hover-border);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }

    .item-checkbox {
      width: 1.25rem;
      height: 1.25rem;
      cursor: pointer;
      accent-color: var(--btn-primary);
      flex-shrink: 0;
    }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .item-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
      word-break: break-word;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .item-quantity {
      font-size: 0.72rem;
      background: var(--badge-bg);
      padding: 0.15rem 0.55rem;
      border-radius: 30px;
      color: var(--badge-color);
      font-weight: 500;
    }

    .item-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--price-color);
    }

    .purchased .item-name,
    .purchased .item-price {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .purchased .item-quantity {
      opacity: 0.7;
      text-decoration: line-through;
    }

    .item-actions {
      display: flex;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      border-radius: 2rem;
      color: #bc9a8c;
      transition: 0.2s;
    }

    .delete-btn:hover {
      background: rgba(217, 83, 79, 0.15);
      color: var(--danger);
    }

    .empty-message {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--empty-color);
      background: var(--empty-bg);
      border-radius: 1.5rem;
      font-size: 0.9rem;
      border: 1px dashed var(--empty-border);
    }

    .empty-message span {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 0.4rem;
    }

    /* итоги и скидка */
    .totals-panel {
      margin: 1rem 0.6rem 0;
      padding: 1rem 1.1rem;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 1.2rem;
    }

    .totals-panel h3 {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--stats-color);
      margin-bottom: 0.4rem;
    }

    .totals-row.discount-row {
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .discount-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .discount-input-wrap input {
      width: 4rem;
      padding: 0.35rem 0.5rem;
      border: 1.5px solid var(--input-border);
      border-radius: 0.5rem;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
      text-align: right;
      outline: none;
    }

    .discount-input-wrap input:focus {
      border-color: var(--input-focus);
    }

    .totals-row.final {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 2px solid var(--panel-border);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .totals-row.final .amount {
      color: var(--price-color);
      font-size: 1.35rem;
    }

    .totals-row .amount-negative {
      color: var(--danger);
    }

    /* модальное окно настроек */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 1.5rem;
      max-width: 400px;
      width: 100%;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
      color: var(--text-primary);
    }

    .modal h2 {
      margin: 0 0 1.25rem;
      font-size: 1.25rem;
    }

    .setting-group {
      margin-bottom: 1.25rem;
    }

    .setting-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--label-color);
      margin-bottom: 0.5rem;
    }

    .theme-switch {
      display: flex;
      gap: 0.5rem;
    }

    .theme-option {
      flex: 1;
      padding: 0.75rem;
      border: 2px solid var(--input-border);
      border-radius: 1rem;
      background: var(--input-bg);
      cursor: pointer;
      text-align: center;
      font-size: 0.9rem;
      transition: 0.2s;
      color: var(--text-primary);
    }

    .theme-option.active {
      border-color: var(--btn-primary);
      background: var(--badge-bg);
      font-weight: 600;
    }

    .modal-close {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      border: none;
      border-radius: 1rem;
      background: var(--btn-primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-close:hover {
      background: var(--btn-primary-hover);
    }

    @media (max-width: 520px) {
      .form-row { flex-direction: column; align-items: stretch; }
      .btn-add { justify-content: center; }
      .input-group.narrow { flex: 1; min-width: 0; }
      .shopping-card { border-radius: 1.25rem; }
      body { padding: 0.75rem; }
    }
  </style>
</head>
<body>
<div class="shopping-card">
  <div class="header">
    <div class="header-main">
      <h1>Маркет-лист</h1>
      <div class="sub">Списки • цены • тема оформления</div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
    </div>
  </div>

  <div class="lists-bar">
    <div class="lists-tabs" id="listsTabs"></div>
    <button type="button" class="btn-small" id="addListBtn" title="Новый список">+ Список</button>
  </div>
  <div class="lists-bar" id="listEditBar" style="display: none; padding-top: 0;">
    <div class="list-name-edit">
      <input type="text" id="listNameInput" maxlength="40" placeholder="Название списка">
      <button type="button" class="btn-small" id="saveListNameBtn">Сохранить</button>
      <button type="button" class="btn-small outline danger" id="deleteListBtn">Удалить</button>
    </div>
  </div>

  <div class="add-form">
    <div class="form-row">
      <div class="input-group">
        <label>Товар</label>
        <input type="text" id="productName" placeholder="Яблоки" autocomplete="off">
      </div>
      <div class="input-group narrow">
        <label>Кол-во</label>
        <input type="text" id="productQuantity" placeholder="2 кг" autocomplete="off">
      </div>
      <div class="input-group narrow">
        <label>Цена, ₽</label>
        <input type="number" id="productPrice" placeholder="0" min="0" step="0.01" autocomplete="off">
      </div>
      <button type="button" class="btn-add" id="addButton">➕ Добавить</button>
    </div>
  </div>

  <div class="list-container">
    <div class="stats">
      <span>📋 Всего: <strong id="totalCount">0</strong></span>
      <span>✅ Куплено: <strong id="purchasedCount">0</strong></span>
      <span>💰 Сумма: <strong id="itemsSumShort">0 ₽</strong></span>
    </div>

    <ul class="shopping-list" id="shoppingList"></ul>

    <div class="totals-panel">
      <h3>💳 Итого к оплате</h3>
      <div class="totals-row">
        <span>Подытог (все позиции)</span>
        <span class="amount" id="subtotalAmount">0 ₽</span>
      </div>
      <div class="totals-row discount-row">
        <span>Скидка, %</span>
        <div class="discount-input-wrap">
          <input type="number" id="discountPercent" min="0" max="100" step="0.1" value="0">
          <span>%</span>
        </div>
        <span class="amount amount-negative" id="discountAmount">−0 ₽</span>
      </div>
      <div class="totals-row final">
        <span>Итого потратите</span>
        <span class="amount" id="finalAmount">0 ₽</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Настройки</h2>
    <div class="setting-group">
      <label>Тема оформления</label>
      <div class="theme-switch">
        <button type="button" class="theme-option active" data-theme="light">☀️ Светлая</button>
        <button type="button" class="theme-option" data-theme="dark">🌙 Тёмная</button>
      </div>
    </div>
    <p style="margin: 0; font-size: 0.85rem; color: var(--label-color);">
      Скидка настраивается в блоке «Итого» у каждого списка и сохраняется отдельно.
    </p>
    <button type="button" class="modal-close" id="closeSettingsBtn">Готово</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'shoppingListApp_v2';

  let appState = {
    theme: 'light',
    activeListId: null,
    lists: []
  };

  const productNameInput = document.getElementById('productName');
  const productQuantityInput = document.getElementById('productQuantity');
  const productPriceInput = document.getElementById('productPrice');
  const addBtn = document.getElementById('addButton');
  const shoppingListEl = document.getElementById('shoppingList');
  const totalCountSpan = document.getElementById('totalCount');
  const purchasedCountSpan = document.getElementById('purchasedCount');
  const itemsSumShort = document.getElementById('itemsSumShort');
  const subtotalAmount = document.getElementById('subtotalAmount');
  const discountPercentInput = document.getElementById('discountPercent');
  const discountAmountEl = document.getElementById('discountAmount');
  const finalAmountEl = document.getElementById('finalAmount');
  const listsTabsEl = document.getElementById('listsTabs');
  const listEditBar = document.getElementById('listEditBar');
  const listNameInput = document.getElementById('listNameInput');
  const settingsModal = document.getElementById('settingsModal');

  function getActiveList() {
    return appState.lists.find(l => l.id === appState.activeListId) || null;
  }

  function getItems() {
    const list = getActiveList();
    return list ? list.items : [];
  }

  function setItems(items) {
    const list = getActiveList();
    if (list) list.items = items;
  }

  function formatMoney(n) {
    const v = Math.max(0, Number(n) || 0);
    return v.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ₽';
  }

  function parsePrice(val) {
    const n = parseFloat(String(val).replace(',', '.'));
    return isNaN(n) || n < 0 ? 0 : Math.round(n * 100) / 100;
  }

  function calcSubtotal(items) {
    return items.reduce((sum, item) => sum + (parsePrice(item.price) || 0), 0);
  }

  function calcTotals(items, discountPercent) {
    const subtotal = calcSubtotal(items);
    const pct = Math.min(100, Math.max(0, parsePrice(discountPercent)));
    const discountValue = Math.round(subtotal * pct / 100 * 100) / 100;
    const final = Math.round((subtotal - discountValue) * 100) / 100;
    return { subtotal, discountValue, final, pct };
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === theme);
    });
  }

  function migrateOldStorage() {
    const old = localStorage.getItem('shoppingListItems');
    if (!old) return null;
    try {
      const parsed = JSON.parse(old);
      if (!Array.isArray(parsed) || !parsed.length) return null;
      const items = parsed.map(it => ({
        id: it.id || Date.now() + Math.random(),
        name: it.name || '',
        quantity: it.quantity || '',
        price: it.price != null ? parsePrice(it.price) : 0,
        purchased: !!it.purchased
      }));
      return items;
    } catch (e) {
      return null;
    }
  }

  function createDefaultList(name, items) {
    return {
      id: Date.now() + Math.floor(Math.random() * 1000),
      name,
      discount: 0,
      items: items || []
    };
  }

  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && Array.isArray(parsed.lists)) {
          appState.theme = parsed.theme === 'dark' ? 'dark' : 'light';
          appState.lists = parsed.lists.map(l => ({
            id: l.id,
            name: l.name || 'Список',
            discount: Math.min(100, Math.max(0, parsePrice(l.discount))),
            items: (l.items || []).map(it => ({
              id: it.id,
              name: it.name || '',
              quantity: it.quantity || '',
              price: parsePrice(it.price),
              purchased: !!it.purchased
            }))
          }));
          appState.activeListId = parsed.activeListId;
          if (!appState.lists.find(l => l.id === appState.activeListId)) {
            appState.activeListId = appState.lists[0]?.id ?? null;
          }
          applyTheme(appState.theme);
          return;
        }
      } catch (e) { console.warn(e); }
    }

    const migrated = migrateOldStorage();
    const defaultItems = migrated || [
      { id: Date.now() + 1, name: 'Помидоры', quantity: '1 кг', price: 189, purchased: false },
      { id: Date.now() + 2, name: 'Молоко', quantity: '2 л', price: 95, purchased: true },
      { id: Date.now() + 3, name: 'Хлеб', quantity: '1 батон', price: 52, purchased: false }
    ];

    const list1 = createDefaultList('Продукты', defaultItems);
    const list2 = createDefaultList('Для дома', [
      { id: Date.now() + 10, name: 'Стиральный порошок', quantity: '1 уп.', price: 420, purchased: false }
    ]);
    appState.lists = [list1, list2];
    appState.activeListId = list1.id;
    appState.theme = 'light';
    applyTheme('light');
    saveState();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderListTabs() {
    listsTabsEl.innerHTML = '';
    appState.lists.forEach(list => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'list-tab' + (list.id === appState.activeListId ? ' active' : '');
      btn.textContent = list.name;
      btn.title = list.name;
      btn.addEventListener('click', () => {
        appState.activeListId = list.id;
        saveState();
        renderAll();
      });
      listsTabsEl.appendChild(btn);
    });

    const active = getActiveList();
    if (active) {
      listEditBar.style.display = 'flex';
      listNameInput.value = active.name;
      discountPercentInput.value = active.discount;
    } else {
      listEditBar.style.display = 'none';
    }
  }

  function updateStatsAndTotals() {
    const items = getItems();
    const list = getActiveList();
    const discount = list ? list.discount : 0;
    const { subtotal, discountValue, final } = calcTotals(items, discount);

    totalCountSpan.textContent = items.length;
    purchasedCountSpan.textContent = items.filter(i => i.purchased).length;
    itemsSumShort.textContent = formatMoney(subtotal);
    subtotalAmount.textContent = formatMoney(subtotal);
    discountAmountEl.textContent = '−' + formatMoney(discountValue);
    finalAmountEl.textContent = formatMoney(final);
  }

  function renderList() {
    const items = getItems();
    shoppingListEl.innerHTML = '';

    if (items.length === 0) {
      const emptyLi = document.createElement('li');
      emptyLi.className = 'empty-message';
      emptyLi.innerHTML = '<span>🛍️</span> Список пуст<br>Добавьте первый товар';
      shoppingListEl.appendChild(emptyLi);
      updateStatsAndTotals();
      return;
    }

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'list-item' + (item.purchased ? ' purchased' : '');

      const itemInfo = document.createElement('div');
      itemInfo.className = 'item-info';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'item-checkbox';
      checkbox.checked = item.purchased;
      checkbox.addEventListener('change', () => togglePurchased(item.id));

      const details = document.createElement('div');
      details.className = 'item-details';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'item-name';
      nameSpan.textContent = item.name;

      const meta = document.createElement('div');
      meta.className = 'item-meta';

      const quantSpan = document.createElement('span');
      quantSpan.className = 'item-quantity';
      quantSpan.textContent = (item.quantity && item.quantity.trim()) ? item.quantity : 'без кол-ва';

      const priceSpan = document.createElement('span');
      priceSpan.className = 'item-price';
      priceSpan.textContent = formatMoney(item.price);

      meta.appendChild(quantSpan);
      meta.appendChild(priceSpan);
      details.appendChild(nameSpan);
      details.appendChild(meta);
      itemInfo.appendChild(checkbox);
      itemInfo.appendChild(details);

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerHTML = '🗑️';
      deleteBtn.title = 'Удалить';
      deleteBtn.addEventListener('click', () => deleteItem(item.id));

      const actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.appendChild(deleteBtn);

      li.appendChild(itemInfo);
      li.appendChild(actions);
      shoppingListEl.appendChild(li);
    });

    updateStatsAndTotals();
    saveState();
  }

  function renderAll() {
    renderListTabs();
    renderList();
  }

  function addItem() {
    const rawName = productNameInput.value.trim();
    const rawQuantity = productQuantityInput.value.trim();
    const price = parsePrice(productPriceInput.value);

    if (!rawName) {
      alert('Укажите название товара');
      productNameInput.focus();
      return;
    }

    const list = getActiveList();
    if (!list) return;

    const newItem = {
      id: Date.now(),
      name: rawName.slice(0, 60),
      quantity: rawQuantity.slice(0, 40),
      price,
      purchased: false
    };

    list.items.push(newItem);
    renderList();
    productNameInput.value = '';
    productQuantityInput.value = '';
    productPriceInput.value = '';
    productNameInput.focus();
  }

  function togglePurchased(id) {
    const items = getItems();
    const item = items.find(i => i.id === id);
    if (item) {
      item.purchased = !item.purchased;
      renderList();
    }
  }

  function deleteItem(id) {
    const list = getActiveList();
    if (!list) return;
    list.items = list.items.filter(i => i.id !== id);
    renderList();
  }

  function addNewList() {
    const name = 'Список ' + (appState.lists.length + 1);
    const list = createDefaultList(name, []);
    appState.lists.push(list);
    appState.activeListId = list.id;
    saveState();
    renderAll();
    listNameInput.focus();
    listNameInput.select();
  }

  function saveListName() {
    const list = getActiveList();
    if (!list) return;
    const name = listNameInput.value.trim();
    if (!name) {
      alert('Введите название списка');
      return;
    }
    list.name = name.slice(0, 40);
    saveState();
    renderAll();
  }

  function deleteCurrentList() {
    if (appState.lists.length <= 1) {
      alert('Нельзя удалить единственный список');
      return;
    }
    if (!confirm('Удалить этот список и все товары в нём?')) return;
    appState.lists = appState.lists.filter(l => l.id !== appState.activeListId);
    appState.activeListId = appState.lists[0].id;
    saveState();
    renderAll();
  }

  function setupEventListeners() {
    addBtn.addEventListener('click', addItem);
    [productNameInput, productQuantityInput, productPriceInput].forEach(inp => {
      inp.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); addItem(); }
      });
    });

    document.getElementById('addListBtn').addEventListener('click', addNewList);
    document.getElementById('saveListNameBtn').addEventListener('click', saveListName);
    document.getElementById('deleteListBtn').addEventListener('click', deleteCurrentList);
    listNameInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') saveListName();
    });

    discountPercentInput.addEventListener('input', () => {
      const list = getActiveList();
      if (!list) return;
      list.discount = Math.min(100, Math.max(0, parsePrice(discountPercentInput.value)));
      updateStatsAndTotals();
      saveState();
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      settingsModal.classList.add('open');
    });
    document.getElementById('closeSettingsBtn').addEventListener('click', () => {
      settingsModal.classList.remove('open');
    });
    settingsModal.addEventListener('click', e => {
      if (e.target === settingsModal) settingsModal.classList.remove('open');
    });

    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.addEventListener('click', () => {
        appState.theme = btn.dataset.theme;
        applyTheme(appState.theme);
        saveState();
      });
    });
  }

  loadState();
  renderAll();
  setupEventListeners();
</script>
</body>
</html>
