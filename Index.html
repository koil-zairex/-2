<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Shopping — Списки, цены, магазины</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
  <div class="top-bar">
    <div class="lists-controls">
      <div class="list-selector">
        <span>📋 Список:</span>
        <select id="listSelector"></select>
        <button type="button" id="newListBtn" class="icon-btn">➕ Новый</button>
        <button type="button" id="deleteListBtn" class="icon-btn secondary">🗑 Удалить</button>
      </div>
    </div>
    <button type="button" id="themeToggle" class="theme-toggle">🌓 Тема</button>
  </div>

  <div class="shopping-card">
    <div class="list-header">
      <input type="text" id="listTitleInput" class="list-title" value="Мои покупки" aria-label="Название списка">
      <div class="global-discount">
        <label for="globalDiscount">💸 Скидка на всё (%):</label>
        <input type="number" id="globalDiscount" min="0" max="100" step="1" value="0">
      </div>
    </div>

    <div class="add-form">
      <div class="field">
        <label for="itemName">Товар</label>
        <input type="text" id="itemName" placeholder="Хлеб" autocomplete="off">
      </div>
      <div class="field">
        <label for="itemStore">Магазин</label>
        <input type="text" id="itemStore" placeholder="Пятёрочка" autocomplete="off">
      </div>
      <div class="field">
        <label for="itemQty">Кол-во</label>
        <input type="text" id="itemQty" placeholder="2 шт" autocomplete="off">
      </div>
      <div class="field">
        <label for="itemPrice">Цена (₽)</label>
        <input type="number" id="itemPrice" placeholder="0" step="any" value="">
      </div>
      <div class="field">
        <label for="itemDiscount">Скидка %</label>
        <input type="number" id="itemDiscount" min="0" max="100" value="0">
      </div>
      <button type="button" id="addItemBtn" class="btn-add">➕ Добавить</button>
      <p id="priceHint" class="price-hint" hidden></p>
    </div>

    <div class="items-container">
      <div class="stats">
        <span>📦 Всего: <strong id="totalItems">0</strong></span>
        <span>✅ Куплено: <strong id="purchasedItems">0</strong></span>
        <span class="total-cost" id="totalCostDisplay">💰 Итого: 0 ₽</span>
      </div>
      <ul class="shopping-list" id="shoppingList"></ul>
    </div>
  </div>
</div>

<script src="js/logic.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
